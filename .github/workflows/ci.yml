name: CI

on:
  push:
    branches: [main, "codex/2-epig-after-sales"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + mypy + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # uv.lock is the reproducibility anchor; fail fast if it drifts from pyproject.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lockfile in sync
        run: uv lock --check

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install locked environment
        run: uv sync --frozen --extra dev

      - name: Project documentation
        run: uv run python scripts/check_project_docs.py

      - name: After-sales contract
        run: uv run python scripts/check_epig_after_sales_contract.py

      - name: E-pig demo policy bundle
        run: uv run python scripts/check_epig_policy.py

      - name: E-pig policy retrieval eval
        run: uv run python -m eval.runner --task epig-policy

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: >-
          uv run pytest -q
          --cov=app --cov=eval
          --cov-report=term:skip-covered
          --cov-fail-under=70

  frontend:
    name: frontend (node 24)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build

  after-sales-postgres:
    name: after-sales PostgreSQL acceptance (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install locked environment
        run: uv sync --frozen --extra dev

      # The runner owns one disposable postgres:16-alpine container on a random
      # loopback port, probes it with real credentials, and cleans it up.
      - name: After-sales PostgreSQL acceptance
        run: uv run python scripts/run_after_sales_pg.py
