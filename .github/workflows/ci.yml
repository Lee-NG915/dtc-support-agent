name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + mypy + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # uv.lock is the reproducibility anchor; fail fast if it drifts from pyproject.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lockfile in sync
        run: uv lock --check

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install locked environment
        run: uv sync --frozen --extra dev

      - name: Project documentation
        run: uv run python scripts/check_project_docs.py

      - name: After-sales contract
        run: uv run python scripts/check_epig_after_sales_contract.py

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: >-
          uv run pytest -q
          --cov=app --cov=eval
          --cov-report=term:skip-covered
          --cov-fail-under=70
